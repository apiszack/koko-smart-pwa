<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#061a3a">

  <meta name="description"
        content="KOKO SMART SK KEMASEK - Kad Kokurikulum dan PAJSK">

  <link rel="manifest" href="./manifest.json">

  <link rel="icon"
        type="image/png"
        sizes="192x192"
        href="./icon-192.png">

  <title>KOKO SMART SK KEMASEK</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, #123d78 0%, transparent 35%),
        linear-gradient(135deg, #020b1c, #061a3a 55%, #082b5c);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 460px;
      text-align: center;
    }

    .logo {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 34px;
      box-shadow:
        0 20px 50px rgba(0,0,0,.45),
        0 0 35px rgba(0,180,255,.2);
      margin-bottom: 24px;
    }

    h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .subtitle {
      margin-top: 8px;
      color: #b9c9df;
      font-size: 15px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 13px;
      color: #cfe4ff;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #20d889;
      box-shadow: 0 0 10px #20d889;
    }

    .card {
      margin-top: 28px;
      padding: 24px;
      border-radius: 24px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .open-btn {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 17px 20px;
      font-size: 16px;
      font-weight: 800;
      color: #061a3a;
      background: linear-gradient(135deg, #ffffff, #cceeff);
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      transition: .2s;
    }

    .open-btn:active {
      transform: scale(.98);
    }

    .install-btn {
      width: 100%;
      margin-top: 12px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 16px;
      padding: 15px 20px;
      font-size: 15px;
      font-weight: 700;
      color: white;
      background: rgba(255,255,255,.08);
      cursor: pointer;
      display: none;
    }

    .info {
      margin-top: 18px;
      color: #91a8c5;
      font-size: 12px;
      line-height: 1.6;
    }

    .footer {
      margin-top: 25px;
      color: #7189a8;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <main class="app">

    <img
      class="logo"
      src="./icon-512.png"
      alt="KOKO SMART SK KEMASEK">

    <h1>KOKO SMART</h1>

    <div class="subtitle">
      SK KEMASEK
    </div>

    <div class="status">
      <span class="dot"></span>
      Sistem PWA Aktif
    </div>

    <section class="card">

      <button class="open-btn" onclick="openKoko()">
        🚀 BUKA KOKO SMART
      </button>

      <button
        id="installBtn"
        class="install-btn"
        onclick="installApp()">
        📱 PASANG APLIKASI
      </button>

      <div class="info">
        Kad Kokurikulum • PAJSK • Dashboard • Analisis
      </div>

    </section>

    <div class="footer">
      KOKO SMART SK KEMASEK © 2026
    </div>

  </main>

<script>

  /*
   * URL SISTEM KOKO SMART V11
   */
  const KOKO_URL =
    "https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbxpCIKlY2ko42RFOO4QMigr1JzcIRBhvHbVrSFHzRFhqFz9hpPX6ZPUDIk-w5IqnyVc/exec";


  /*
   * BUKA SISTEM KOKO SMART
   */
  function openKoko() {
    window.location.href = KOKO_URL;
  }


  /*
   * PWA INSTALL PROMPT
   */
  let deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", (event) => {

    event.preventDefault();

    deferredPrompt = event;

    const installBtn =
      document.getElementById("installBtn");

    installBtn.style.display = "block";

  });


  async function installApp() {

    if (!deferredPrompt) {
      alert(
        "Jika butang pemasangan tidak muncul, gunakan menu browser dan pilih 'Install App' atau 'Add to Home Screen'."
      );
      return;
    }

    deferredPrompt.prompt();

    const result =
      await deferredPrompt.userChoice;

    deferredPrompt = null;

    document.getElementById("installBtn")
      .style.display = "none";
  }


  /*
   * SERVICE WORKER
   */
  if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

      navigator.serviceWorker
        .register("./service-worker.js")
        .then(() => {
          console.log("KOKO SMART Service Worker aktif");
        })
        .catch((error) => {
          console.log(
            "Service Worker belum tersedia:",
            error
          );
        });

    });

  }

</script>

</body>
</html>
